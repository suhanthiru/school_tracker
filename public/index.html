<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>School Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <div class="brand">School Tracker</div>
  <nav id="tabs">
    <button data-tab="radar" class="tab active">Radar</button>
    <button data-tab="week" class="tab">Week</button>
    <button data-tab="planner" class="tab">Planner</button>
  </nav>
  <div class="spacer"></div>
  <div id="health-strip" title="per-source sync health"></div>
  <div id="last-sync" class="dim"></div>
  <button id="sync-now" class="btn">Sync</button>
  <button id="open-settings" class="btn ghost" title="Settings">⚙</button>
</header>

<div id="alert-bar" class="hidden"></div>

<main>
  <section id="view-radar" class="view"></section>
  <section id="view-week" class="view hidden"></section>
  <section id="view-planner" class="view hidden"></section>
</main>

<div id="toast-strip"></div>

<!-- Settings modal -->
<div id="settings-modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">Settings</div>
      <button class="btn ghost" id="close-settings">✕</button>
    </div>
    <div id="settings-body"></div>
  </div>
</div>

<!-- Syllabus import -->
<div id="syllabus-modal" class="modal hidden">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">Import a syllabus</div>
      <button class="btn ghost" id="close-syllabus">✕</button>
    </div>
    <div class="set-hint">Every dated deliverable in the syllabus — psets, projects, exams — lands on the radar. Re-importing an updated syllabus refreshes dates instead of duplicating.</div>
    <div class="set-row">Course:
      <select id="syl-course"><option value="">(none)</option></select>
    </div>
    <textarea id="syl-text" rows="10" style="width:100%" placeholder="Paste the syllabus text here…"></textarea>
    <div class="set-row" style="justify-content:flex-end;margin-top:10px">
      <span class="test-result" id="syl-result"></span>
      <button class="btn hidden" id="syl-file">Choose PDF instead…</button>
      <button class="btn primary" id="syl-import">Import</button>
    </div>
  </div>
</div>

<!-- First-run onboarding -->
<div id="onboarding" class="modal hidden">
  <div class="modal-card wide">
    <div id="onboarding-body"></div>
  </div>
</div>

<script src="app.js"></script>
<script src="radar.js"></script>
<script src="week.js"></script>
<script src="planner.js"></script>
<script src="settings.js"></script>
<script>App.boot();</script>
</body>
</html>
